name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify world clock translations
        run: node --test tests/world-clock-i18n.test.mjs

      - name: Read tag version
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="$TAG"
          ZIP_NAME="pf2e-compendium-extra-cn-v${VERSION}.zip"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Verify module.json version matches tag
        run: |
          MJ_VERSION=$(jq -r .version module.json)
          if [ "$MJ_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::module.json version ($MJ_VERSION) != tag (${{ steps.version.outputs.version }})"
            exit 1
          fi
          echo "module.json version matches tag: $MJ_VERSION"

      - name: Verify download URL points to this tag
        run: |
          DOWNLOAD=$(jq -r .download module.json)
          EXPECTED=".*/releases/download/${{ steps.version.outputs.tag }}/${{ steps.version.outputs.zip_name }}"
          if ! echo "$DOWNLOAD" | grep -qE "$EXPECTED"; then
            echo "::error::module.json download URL ($DOWNLOAD) does not match expected pattern $EXPECTED"
            exit 1
          fi
          echo "download URL ok: $DOWNLOAD"

      - name: Build module zip
        # White-list: only ship files FVTT actually needs at runtime.
        # See RELEASE_PROCESS.md "ZIP 打包" section. Adding new top-level
        # files (e.g. dev-only glossaries, build artifacts, docs) will NOT
        # accidentally leak into release archives unless added here.
        run: |
          ZIP_NAME="${{ steps.version.outputs.zip_name }}"
          zip -r "$ZIP_NAME" \
            module.json \
            babele.js \
            inject-lang.js \
            compendium \
            compendium-851 \
            homebrew \
            lang \
            scripts \
            .gitignore
          ls -la "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | tail -5

      - name: Generate release body
        # Use the tag commit's full message (subject + body) as the release
        # notes — that's where the detailed change description lives — and
        # append the standard install/requires footer template.
        run: |
          {
            git log -1 --format=%B "${{ steps.version.outputs.tag }}"
            echo ""
            echo "---"
            echo ""
            cat .github/release-body-template.md
          } > _release_body.md
          echo "::group::release body"
          cat _release_body.md
          echo "::endgroup::"

      - name: Package optional AV source compatibility patches
        run: |
          cd compat/av-1.0.50
          zip -r "../../av-source-compat-v${{ steps.version.outputs.version }}.zip" README.md manifest.json av-source-compat.patch verify.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          body_path: _release_body.md
          fail_on_unmatched_files: true
          files: |
            module.json
            ${{ steps.version.outputs.zip_name }}
            av-source-compat-v${{ steps.version.outputs.version }}.zip

      # Releases are published to GitHub only. Registry notification is intentionally absent.
